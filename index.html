﻿<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FunLink CMS v2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:#f3f4f6;color:#1f2937;display:flex;height:100vh;overflow:hidden}
#sidebar{width:280px;min-width:280px;background:#1a2744;display:flex;flex-direction:column;overflow-y:auto;z-index:10}
#sidebar-header{padding:20px 16px 16px;border-bottom:1px solid #253461}
#sidebar-header .logo{font-size:20px;font-weight:700;color:#fff;letter-spacing:1px}
#sidebar-header .logo span{color:#3b82f6}
nav{flex:1;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;cursor:pointer;color:#94a3b8;font-size:14px;font-weight:500;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:#253461;color:#e2e8f0;border-left-color:#3b82f6}
.nav-item.active{background:#2e4070;color:#fff;border-left-color:#3b82f6}
.nav-item .icon{font-size:18px;min-width:24px;text-align:center}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:56px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 24px;gap:16px}
#topbar h1{font-size:18px;font-weight:700;color:#1f2937}
#content{flex:1;overflow-y:auto;padding:24px}
.card{background:#fff;border-radius:10px;border:1px solid #e5e7eb;padding:20px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:700;color:#374151;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #f3f4f6}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi-card{background:#fff;border-radius:10px;border:1px solid #e5e7eb;padding:20px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent,#3b82f6)}
.kpi-card.green::before{background:#10b981}
.kpi-card.red::before{background:#ef4444}
.kpi-card.yellow::before{background:#f59e0b}
.kpi-card.purple::before{background:#8b5cf6}
.kpi-label{font-size:12px;color:#6b7280;font-weight:500;margin-bottom:6px}
.kpi-value{font-size:28px;font-weight:700;color:#1f2937}
.kpi-sub{font-size:12px;color:#9ca3af;margin-top:4px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f9fafb;border-bottom:2px solid #e5e7eb;padding:10px 12px;text-align:left;font-weight:600;color:#374151;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #f3f4f6;color:#4b5563;vertical-align:middle}
tr:hover td{background:#f9fafb}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:600}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-yellow{background:#fef9c3;color:#854d0e}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-purple{background:#ede9fe;color:#5b21b6}
.badge-gray{background:#f3f4f6;color:#6b7280}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-secondary{background:#f3f4f6;color:#374151;border:1px solid #d1d5db}
.btn-secondary:hover{background:#e5e7eb}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-success{background:#10b981;color:#fff}
.btn-success:hover{background:#059669}
.btn-sm{padding:4px 10px;font-size:12px}
input[type=text],input[type=date],input[type=email],input[type=tel],input[type=number],input[type=url],select,textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:13px;font-family:inherit;color:#1f2937;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
textarea{resize:vertical;min-height:80px}
label{font-size:13px;font-weight:500;color:#374151;display:block;margin-bottom:4px}
.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
#modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;max-width:700px;width:95%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-lg{max-width:940px}
.modal-xl{max-width:1100px}
.modal-header{padding:18px 22px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:16px;font-weight:700;color:#1f2937}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#9ca3af;line-height:1}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 22px;border-top:1px solid #e5e7eb;display:flex;gap:10px;justify-content:flex-end}
.tabs{display:flex;gap:2px;border-bottom:2px solid #e5e7eb;margin-bottom:18px}
.tab{padding:9px 18px;cursor:pointer;font-size:13px;font-weight:500;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab.active{color:#3b82f6;border-bottom-color:#3b82f6}
.tab:hover{color:#374151}
.filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filter-bar input,.filter-bar select{width:auto;min-width:160px}
.pagination{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:16px}
.pagination button{padding:6px 12px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}
.pagination button.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.pagination-info{font-size:13px;color:#6b7280;margin-left:8px}
.two-panel{display:grid;grid-template-columns:300px 1fr;gap:16px;height:calc(100vh - 130px)}
.panel-left{background:#fff;border-radius:10px;border:1px solid #e5e7eb;display:flex;flex-direction:column;overflow:hidden}
.panel-right{background:#fff;border-radius:10px;border:1px solid #e5e7eb;display:flex;flex-direction:column;overflow:hidden}
.panel-search{padding:12px;border-bottom:1px solid #f3f4f6}
.case-list{flex:1;overflow-y:auto}
.case-item{padding:11px 14px;cursor:pointer;border-bottom:1px solid #f9fafb;transition:background .1s}
.case-item:hover{background:#f0f7ff}
.case-item.active{background:#dbeafe}
.case-item .fl{font-size:11px;color:#6b7280;font-weight:600}
.case-item .name{font-size:13px;font-weight:500;color:#1f2937;margin-top:1px}
.chat-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:200px}
.bubble-wrap{display:flex;flex-direction:column;max-width:75%}
.bubble-wrap.right{align-self:flex-end;align-items:flex-end}
.bubble-wrap.left{align-self:flex-start;align-items:flex-start}
.bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bubble.right{background:#3b82f6;color:#fff;border-bottom-right-radius:3px}
.bubble.left{background:#f3f4f6;color:#1f2937;border-bottom-left-radius:3px}
.bubble-meta{font-size:11px;color:#9ca3af;margin-top:3px}
.pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pipeline-col{background:#f9fafb;border-radius:10px;padding:12px}
.pipeline-col-header{font-size:13px;font-weight:700;color:#374151;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.pipeline-card{background:#fff;border-radius:8px;border:1px solid #e5e7eb;padding:12px;margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#e5e7eb;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden}
.cal-header-cell{background:#f9fafb;text-align:center;padding:8px;font-size:12px;font-weight:600;color:#6b7280}
.cal-day{background:#fff;min-height:80px;padding:6px;font-size:12px;color:#9ca3af}
.cal-day .day-num{font-weight:600;font-size:13px;color:#374151;margin-bottom:4px}
.cal-day.today{background:#eff6ff}
.cal-day.today .day-num{color:#3b82f6}
.cal-day.empty{background:#fafafa}
.cal-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin:1px}
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-item{padding:12px 18px;border-radius:8px;color:#fff;font-size:14px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:slideIn .3s ease;max-width:320px}
.toast-item.success{background:#10b981}
.toast-item.error{background:#ef4444}
.toast-item.info{background:#3b82f6}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:16px;font-weight:700;color:#1f2937}
.empty-state{text-align:center;padding:48px;color:#9ca3af}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.link-btn{background:none;border:none;color:#3b82f6;cursor:pointer;font-size:12px;text-decoration:underline;padding:0}
hr{border:none;border-top:1px solid #f3f4f6;margin:14px 0}
.text-sm{font-size:12px}
.text-muted{color:#9ca3af}
.fw-bold{font-weight:700}
.progress-bar{background:#e5e7eb;border-radius:9999px;height:8px;overflow:hidden}
.progress-fill{height:100%;background:#3b82f6;border-radius:9999px;transition:width .3s}
.tag{display:inline-flex;padding:2px 8px;background:#f3f4f6;border-radius:5px;font-size:11px;color:#374151;margin:2px}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feature-item{padding:10px;border:1px solid #e5e7eb;border-radius:8px;display:flex;align-items:center;gap:8px;font-size:13px}
.panel-right-inner{flex:1;overflow-y:auto;padding:20px}
.detail-section{margin-bottom:20px}
.detail-section h3{font-size:14px;font-weight:700;color:#374151;margin-bottom:10px}
.info-grid{display:grid;grid-template-columns:120px 1fr;gap:6px 16px;font-size:13px}
.info-grid .key{color:#6b7280;font-weight:500}
.info-grid .val{color:#1f2937}
.row-click{cursor:pointer}
</style>

const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let _storeCache = null;

async function loadStoreAsync() {
  if (_storeCache) return _storeCache;
  const { data, error } = await _sb.from('cms_store').select('data').eq('id','main').single();
  _storeCache = (data && data.data) ? data.data : {};
  return _storeCache;
}

async function saveStoreAsync(d) {
  _storeCache = d;
  await _sb.from('cms_store').upsert({ id:'main', data:d, updated_at: new Date().toISOString() });
}

function loadStore() { return _storeCache || {}; }
function saveStore(data) {

  saveStoreAsync(data);
}

async function initApp() {

    ]);
    if (casesRes.error) throw new Error('cases: ' + casesRes.error.message);
    if (casesRes.data && casesRes.data.data) {

    _storeCache = (storeRes.data && storeRes.data.data) ? storeRes.data.data : {};

    document.getElementById('content').innerHTML = '<div style="text-align:center;padding:80px;color:#ef4444;font-size:14px">❌ 読み込みエラー: ' + e.message + '</div>';

  }
}

    <div class="nav-item" data-module="line"><span class="icon">💬</span>LINE対応</div>

  </nav>
</div>
<div id="main">
  <div id="topbar">
    <h1 id="page-title">ダッシュボード</h1>
    <div style="flex:1"></div>
    <span style="font-size:12px;color:#6b7280" id="topbar-sub"></span>
  </div>
  <div id="content"></div>
</div>
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <h2 id="modal-title">-</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>
<div id="toast"></div>
<script>
// ===================== DATA =====================
// データはSupabaseから動的ロード
let MASTER_CASES = [];
let UNMATCHED_CASES = [];
let TENPO_SEARCH = [];

// ===================== STORAGE =====================
// ストレージはSupabaseを使用
function getStore() {
  const d = loadStore();
  if (!d.meetings) d.meetings = [];
  if (!d.tasks) d.tasks = [];
  if (!d.lineMessages) d.lineMessages = [];
  if (!d.reviewGoals) d.reviewGoals = [];
  if (!d.reviewMeasures) d.reviewMeasures = [];
  if (!d.reviewSurveys) d.reviewSurveys = [];
  if (!d.proposals) d.proposals = [];
  if (!d.supportLogs) d.supportLogs = [];
  if (!d.learningItems) d.learningItems = [];
  if (!d.storeLinks) d.storeLinks = {};
  if (!d.lineConfig) d.lineConfig = {};
  if (!d.lineAutoLogs) d.lineAutoLogs = [];
  return d;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ===================== UTILS =====================
function escHtml(s) { if (s == null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtMoney(n) { if (n == null) return '-'; return '¥' + Number(n).toLocaleString(); }
function today() { return new Date().toISOString().slice(0,10); }

function toast(msg, type) {
  type = type || 'success';
  var el = document.createElement('div');
  el.className = 'toast-item ' + type;
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(function(){ el.remove(); }, 3500);
}

function openModal(title, bodyHtml, footerHtml, cls) {
  footerHtml = footerHtml || '';
  cls = cls || '';
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-footer').innerHTML = footerHtml;
  document.getElementById('modal-box').className = 'modal ' + cls;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }

function statusBadge(s) {
  var cls = s==='契約中'?'badge-green':s==='契約終了'?'badge-red':s==='無償運用'?'badge-yellow':'badge-gray';
  return '<span class="badge '+cls+'">'+(s||'不明')+'</span>';
}
function paidBadge(s) {
  if (s === '完了') return '<span class="badge badge-green">完了</span>';
  if (s === '未払い') return '<span class="badge badge-red">未払い</span>';
  return '<span class="badge badge-gray">' + escHtml(s||'-') + '</span>';
}
function taskPriBadge(p) {
  if (p === '高') return '<span class="badge badge-red">高</span>';
  if (p === '中') return '<span class="badge badge-yellow">中</span>';
  return '<span class="badge badge-gray">低</span>';
}
function taskStatusBadge(s) {
  if (s === '完了') return '<span class="badge badge-green">完了</span>';
  if (s === '進行中') return '<span class="badge badge-blue">進行中</span>';
  return '<span class="badge badge-gray">未着手</span>';
}

function paginate(items, page, perPage) {
  perPage = perPage || 30;
  var total = items.length;
  var pages = Math.max(1, Math.ceil(total / perPage));
  var p = Math.min(page, pages);
  return { items: items.slice((p-1)*perPage, p*perPage), page: p, pages: pages, total: total };
}
function renderPagination(pages, current, onClickFn) {
  if (pages <= 1) return '';
  var btns = '<button ' + (current<=1?'disabled':'') + ' onclick="' + onClickFn + '(' + (current-1) + ')">◄</button>';
  var start = Math.max(1, current-2), end = Math.min(pages, current+2);
  if (start > 1) btns += '<button onclick="' + onClickFn + '(1)">1</button>' + (start>2?'<span>...</span>':'');
  for (var i=start; i<=end; i++) btns += '<button class="' + (i===current?'active':'') + '" onclick="' + onClickFn + '(' + i + ')">' + i + '</button>';
  if (end < pages) btns += (end<pages-1?'<span>...</span>':'') + '<button onclick="' + onClickFn + '(' + pages + ')">' + pages + '</button>';
  btns += '<button ' + (current>=pages?'disabled':'') + ' onclick="' + onClickFn + '(' + (current+1) + ')">►</button>';
  return '<div class="pagination">' + btns + '</div>';
}

// Case selector
var _caseSelCallback = null;
function renderCaseSelector(containerId, cb) {
  _caseSelCallback = cb;
  var el = document.getElementById(containerId);
  el.innerHTML = '<div style="position:relative"><input type="text" id="case-sel-input" placeholder="FL番号・会社名で検索" style="max-width:340px" oninput="filterCaseSelector(this.value)"><div id="case-sel-dropdown" style="position:absolute;background:#fff;border:1px solid #e5e7eb;border-radius:8px;max-height:220px;overflow-y:auto;width:340px;z-index:500;display:none;box-shadow:0 4px 16px rgba(0,0,0,.1)"></div></div>';
}
function filterCaseSelector(q) {
  var dd = document.getElementById('case-sel-dropdown');
  if (!q) { dd.style.display='none'; return; }
  var res = MASTER_CASES.filter(function(c){ return c.fl.includes(q) || c.name.toLowerCase().includes(q.toLowerCase()); }).slice(0,20);
  if (!res.length) { dd.style.display='none'; return; }
  dd.innerHTML = res.map(function(c){ return '<div style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #f3f4f6;font-size:13px" onmousedown="selectCase(\'' + escHtml(c.fl) + '\')"><span style="color:#6b7280;font-size:11px">' + escHtml(c.fl) + '</span> ' + escHtml(c.name) + '</div>'; }).join('');
  dd.style.display = 'block';
}
function selectCase(fl) {
  var c = MASTER_CASES.find(function(x){ return x.fl === fl; });
  if (c && _caseSelCallback) _caseSelCallback(c);
  var inp = document.getElementById('case-sel-input');
  if (inp) inp.value = c ? (c.fl + ' - ' + c.name) : fl;
  var dd = document.getElementById('case-sel-dropdown');
  if (dd) dd.style.display = 'none';
}

// Navigation
var currentModule = 'dashboard';
document.querySelectorAll('.nav-item').forEach(function(el){
  el.addEventListener('click', function(){
    document.querySelectorAll('.nav-item').forEach(function(x){ x.classList.remove('active'); });
    el.classList.add('active');
    var mod = el.dataset.module;
    currentModule = mod;
    loadModule(mod);
  });
});

function selectMatchCase(fl) {
  state.matching.selectedFL = fl;
  var c = UNMATCHED_CASES.find(function(x){ return x.fl===fl; });
  if (!c) return;
  var s = getStore();
  var linked = s.storeLinks && s.storeLinks[fl];
  var q = state.matching.search || '';
  var filtered = q ? TENPO_SEARCH.filter(function(t){
    var lq = q.toLowerCase();
    return (t.sname||'').toLowerCase().indexOf(lq)>=0 || (t.cname||'').toLowerCase().indexOf(lq)>=0 || (t.tel||'').indexOf(q)>=0;
  }).slice(0,50) : [];
  var storeRows = filtered.map(function(t){
    var isCur = linked && String(linked.sid)===String(t.sid);

function linkStore(fl, sid, sname, cname, tel) {
  if (!confirm(sname+'\nをFLコード '+fl+' に紐付けますか？')) return;
  var s = getStore();
  s.storeLinks[fl] = { sid:sid, sname:sname, cname:cname, tel:tel, linkedAt:today() };
  saveStore(s);
  toast('紐付けしました: '+fl+' → '+sname);
  state.matching.search = '';
  modules.matching();
  selectMatchCase(fl);
}

function unlinkStore(fl) {
  if (!confirm('紐付けを解除しますか？')) return;
  var s = getStore();
  delete s.storeLinks[fl];
  saveStore(s);
  toast('紐付けを解除しました');
  modules.matching();
  selectMatchCase(fl);
}

modules.line = function() {
  var tab = state.line.tab || 0;
  var tabNames = ['メッセージ管理','Webhook設定','自動返信ログ'];
  var tabsHtml = tabNames.map(function(l,i){
    return '<div class="tab '+(i===tab?'active':'')+'" onclick="state.line.tab='+i+';modules.line()">'+l+'</div>';
  }).join('');
  document.getElementById('content').innerHTML = '<div class="tabs">'+tabsHtml+'</div><div id="line-body"></div>';
  if (tab===0) renderLineMessages();
  else if (tab===1) renderLineWebhook();
  else renderLineAutoLogs();
};

function renderLineMessages() {
  var s = getStore();
  var casesWithLatest = MASTER_CASES.map(function(c){
    var msgs = (s.lineMessages||[]).filter(function(m){ return m.caseFL===c.fl; });
    var latestDate = msgs.length ? msgs.reduce(function(a,b){ return (a.createdAt||'')>(b.createdAt||'')?a:b; }).createdAt||'' : '';
    var unread = msgs.filter(function(m){ return m.status==='未対応'; }).length;
    var hasClam = msgs.some(function(m){ return m.status==='クレーム'; });
    return {c:c, msgs:msgs, latestDate:latestDate, unread:unread, hasClam:hasClam};
  });
  casesWithLatest.sort(function(a,b){
    if (a.latestDate && !b.latestDate) return -1;
    if (!a.latestDate && b.latestDate) return 1;
    return b.latestDate.localeCompare(a.latestDate);
  });
  var leftItems = casesWithLatest.map(function(item){
    var c = item.c;
    var badge = item.hasClam
      ? '<span class="badge badge-red">クレーム</span>'
      : item.unread ? '<span class="badge badge-red">未対応 '+item.unread+'</span>'
      : item.msgs.length ? '<span class="badge badge-green">対応済</span>' : '';
    return '<div class="case-item '+(state.line.selectedFL===c.fl?'active':'')+'" onclick="showLineThread(\''+escHtml(c.fl)+'\')">' +
      '<div class="fl">'+escHtml(c.fl)+(item.latestDate?' <span style="font-size:10px;color:#9ca3af">'+item.latestDate.slice(0,10)+'</span>':'')+
      '</div><div class="name">'+escHtml(c.name)+'</div>' +
      '<div style="margin-top:3px">'+statusBadge(c.status)+' '+badge+'</div></div>';
  }).join('');
  document.getElementById('line-body').innerHTML =
    '<div style="display:flex;height:calc(100vh - 160px);overflow:hidden">' +
    '<div style="width:280px;min-width:280px;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column">' +
    '<div style="padding:10px 12px;border-bottom:1px solid #e5e7eb">' +
    '<input type="text" placeholder="FL・名前で検索..." oninput="filterLineCaseList(this.value)" style="font-size:12px"></div>' +
    '<div id="line-case-list" style="flex:1;overflow-y:auto">'+leftItems+'</div></div>' +
    '<div id="line-thread" style="flex:1;overflow-y:auto;padding:20px;background:#f9fafb">' +
    '<div style="color:#9ca3af;text-align:center;margin-top:80px">左から案件を選択してください</div></div></div>';
  if (state.line.selectedFL) showLineThread(state.line.selectedFL);
}

function filterLineCaseList(q) {
  var list = document.getElementById('line-case-list');
  if (!list) return;
  list.querySelectorAll('.case-item').forEach(function(el){
    el.style.display = !q || el.textContent.toLowerCase().indexOf(q.toLowerCase())>=0 ? '' : 'none';
  });

    (meoUrl?'<a href="'+meoUrl+'" target="_blank" class="btn btn-sm btn-secondary" style="margin-left:auto">&#128279; meo-dash</a>':'')+

    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">' +

    '<div><label>カテゴリ</label><select id="lm_cat"><option>管理画面</option><option>写真</option><option>クチコミ</option><option>解約</option><option>請求</option><option>LINE</option><option>その他</option></select></div></div>' +

function markLineDone(id){
  var s=getStore();
  var m=(s.lineMessages||[]).find(function(x){return x.id===id;});
  if(m){m.status='対応完了';saveStore(s);showLineThread(state.line.selectedFL);toast('完了にしました');}
}
function saveLineMsg(fl){
  var msg=(document.getElementById('lm_msg')||{}).value||'';
  if(!msg.trim()){toast('メッセージ内容は必須です');return;}
  var s=getStore();
  s.lineMessages.push({id:uid(),caseFL:fl,date:(document.getElementById('lm_date')||{}).value||today(),sender:(document.getElementById('lm_sender')||{}).value||'顧客',category:(document.getElementById('lm_cat')||{}).value||'その他',message:msg,replyDraft:(document.getElementById('lm_reply')||{}).value||'',status:(document.getElementById('lm_status')||{}).value||'未対応',createdAt:today()});
  saveStore(s);showLineThread(fl);toast('追加しました');
}
function deleteLineMsg(id){
  if(!confirm('削除しますか？'))return;
  var s=getStore();
  s.lineMessages=s.lineMessages.filter(function(m){return m.id!==id;});
  saveStore(s);showLineThread(state.line.selectedFL);toast('削除しました');
}

    '</div>' +

    (goals.length ? '<div class="table-wrap"><table><thead><tr><th>月</th><th>目標</th><th>実績</th><th>評価平均</th><th></th></tr></thead><tbody>' + histRows + '</tbody></table></div>' : '<div class="empty-state"><p>目標なし</p></div>');

function renderTaskCalendar(){
  var s=getStore();var ts=state.task;
  var y=ts.calYear,m=ts.calMonth;
  var firstDay=new Date(y,m,1).getDay();var daysInMonth=new Date(y,m+1,0).getDate();
  var todayStr=today();var monthStr=y+'-'+String(m+1).padStart(2,'0');
  var taskMap={};
  s.tasks.forEach(function(t){if(t.deadline&&t.deadline.startsWith(monthStr)){var d=t.deadline.slice(8,10);if(!taskMap[d])taskMap[d]=[];taskMap[d].push(t);}});
  var dayNames=['日','月','火','水','木','金','土'];
  var cells=dayNames.map(function(d){return '<div class="cal-header-cell">'+d+'</div>';}).join('');
  for(var i=0;i<firstDay;i++) cells+='<div class="cal-day empty"></div>';
  for(var d=1;d<=daysInMonth;d++){
    var ds=String(d).padStart(2,'0');var fullDate=monthStr+'-'+ds;var isToday=fullDate===todayStr;
    var tdots=(taskMap[ds]||[]).map(function(t){var col=t.priority==='高'?'#ef4444':t.priority==='中'?'#f59e0b':'#10b981';return '<span class="cal-dot" style="background:'+col+'" title="'+escHtml(t.title)+'"></span>';}).join('');
    cells+='<div class="cal-day '+(isToday?'today':'')+'"><div class="day-num">'+d+'</div>'+tdots+'</div>';
  }
  var mnames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  return '<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><button class="btn btn-secondary btn-sm" onclick="state.task.calMonth--;if(state.task.calMonth<0){state.task.calMonth=11;state.task.calYear--;}renderTaskModule()">◄</button><strong>'+y+'年 '+mnames[m]+'</strong><button class="btn btn-secondary btn-sm" onclick="state.task.calMonth++;if(state.task.calMonth>11){state.task.calMonth=0;state.task.calYear++;}renderTaskModule()">►</button></div>' +
    '<div class="cal-grid">'+cells+'</div>' +
    '<div style="margin-top:12px;display:flex;gap:12px;font-size:12px"><span><span class="cal-dot" style="background:#ef4444"></span> 優先度:高</span><span><span class="cal-dot" style="background:#f59e0b"></span> 優先度:中</span><span><span class="cal-dot" style="background:#10b981"></span> 優先度:低</span></div>' +
    '</div>';

function exportICS(){
  var s=getStore();var tasks=s.tasks.filter(function(t){return t.deadline&&t.status!=='完了';});
  if(!tasks.length){toast('エクスポートするタスクなし','info');return;}
  var ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FunLink CMS//JA\r\n";
  tasks.forEach(function(t){var d=t.deadline.replace(/-/g,'');ics+="BEGIN:VEVENT\r\nDTSTART;VALUE=DATE:"+d+"\r\nDTEND;VALUE=DATE:"+d+"\r\nSUMMARY:"+t.title.replace(/[,;\\]/g,'\\$&')+"\r\nEND:VEVENT\r\n";});
  ics+="END:VCALENDAR";
  var blob=new Blob([ics],{type:'text/calendar'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='funlink_tasks.ics';a.click();
  toast(tasks.length+'件のタスクをエクスポート');
}

// PROPOSAL
modules.proposal = function() { renderProposalModule(); };
function renderProposalModule(){
  var s=getStore();var stages=['提案中','検討中','契約','見送り'];var stageColors=['#3b82f6','#f59e0b','#10b981','#6b7280'];
  var cols=stages.map(function(stage,si){
    var props=s.proposals.filter(function(p){return p.status===stage;});
    var cards=props.map(function(p){
      var c=MASTER_CASES.find(function(x){return x.fl===p.caseFL;});
      var moveBtns=stages.filter(function(ss){return ss!==stage;}).map(function(ns){return '<button class="btn btn-sm btn-secondary" style="font-size:10px;padding:2px 6px" onclick="moveProposal(\''+escHtml(p.id)+'\',\''+escHtml(ns)+'\')">→'+ns+'</button>';}).join('');
      return '<div class="pipeline-card"><div style="font-size:11px;color:#6b7280;margin-bottom:2px">'+(c?escHtml(c.fl):escHtml(p.caseFL))+'</div><div style="font-weight:600;font-size:13px;margin-bottom:4px">'+escHtml(p.product)+'</div><div style="font-size:13px;color:#10b981">'+fmtMoney(p.amount)+'</div><div style="font-size:11px;color:#6b7280;margin-top:4px">'+escHtml(p.proposedDate)+'</div>'+(p.note?'<div style="font-size:12px;color:#374151;margin-top:4px">'+escHtml(p.note)+'</div>':'')+'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:8px">'+moveBtns+'<button class="btn btn-sm btn-danger" style="font-size:10px;padding:2px 6px" onclick="deleteProposal(\''+escHtml(p.id)+'\')">削除</button></div></div>';
    }).join('');
    return '<div class="pipeline-col"><div class="pipeline-col-header"><span style="color:'+stageColors[si]+'">'+stage+'</span><span class="badge badge-gray">'+props.length+'</span></div>'+
      (cards||'<div class="text-muted text-sm" style="text-align:center;padding:16px">なし</div>')+
      '</div>';
  }).join('');
  document.getElementById('content').innerHTML=
    '<div class="section-header"><div class="section-title">提案パイプライン</div><button class="btn btn-primary btn-sm" onclick="openProposalForm()">＋ 提案追加</button></div>'+
    '<div class="pipeline">'+cols+'</div>';
}
function openProposalForm(){
  openModal('提案追加',
    '<div class="form-group"><label>案件FL</label><input type="text" id="pf-fl" placeholder="FL00001"></div>' +
    '<div class="form-group"><label>提案商品・プラン</label><input type="text" id="pf-product"></div>' +
    '<div class="form-row"><div class="form-group"><label>金額</label><input type="number" id="pf-amount"></div><div class="form-group"><label>提案日</label><input type="date" id="pf-date" value="'+today()+'"></div></div>' +
    '<div class="form-group"><label>ステータス</label><select id="pf-status"><option>提案中</option><option>検討中</option><option>契約</option><option>見送り</option></select></div>' +
    '<div class="form-group"><label>メモ</label><textarea id="pf-note" rows="2"></textarea></div>',
    '<button class="btn btn-secondary" onclick="closeModal()">キャンセル</button><button class="btn btn-primary" onclick="saveProposal()">保存</button>');
}
function saveProposal(){var s=getStore();s.proposals.push({id:uid(),caseFL:document.getElementById('pf-fl').value,product:document.getElementById('pf-product').value,amount:+document.getElementById('pf-amount').value,proposedDate:document.getElementById('pf-date').value,status:document.getElementById('pf-status').value,note:document.getElementById('pf-note').value});saveStore(s);closeModal();toast('保存しました');renderProposalModule();}
function moveProposal(id,ns){var s=getStore();var p=s.proposals.find(function(x){return x.id===id;});if(p)p.status=ns;saveStore(s);renderProposalModule();}
function deleteProposal(id){if(!confirm('削除しますか？'))return;var s=getStore();s.proposals=s.proposals.filter(function(p){return p.id!==id;});saveStore(s);toast('削除しました','info');renderProposalModule();}

// SUPPORT
modules.support = function() { renderSupportModule(); };
function renderSupportModule(){
  document.getElementById('content').innerHTML='<div class="two-panel"><div class="panel-left"><div class="panel-search"><input type="text" placeholder="FL番号・会社名" oninput="renderSupportList(this.value)"></div><div class="case-list" id="support-case-list"></div></div><div class="panel-right" id="support-right"><div class="empty-state" style="margin:auto"><div class="icon">🛟</div><p>案件を選択してください</p></div></div></div>';
  renderSupportList('');
  if(state.support.selectedFL) showSupportLogs(state.support.selectedFL);
}
function renderSupportList(q){
  var s=getStore();
  var list=MASTER_CASES.filter(function(c){return !q||c.fl.toLowerCase().includes(q.toLowerCase())||c.name.toLowerCase().includes(q.toLowerCase());}).slice(0,80);
  var el=document.getElementById('support-case-list');if(!el)return;
  el.innerHTML=list.map(function(c){
    var cnt=s.supportLogs.filter(function(l){return l.caseFL===c.fl;}).length;
    return '<div class="case-item '+(state.support.selectedFL===c.fl?'active':'')+'" onclick="state.support.selectedFL=\''+escHtml(c.fl)+'\';showSupportLogs(\''+escHtml(c.fl)+'\');renderSupportList(this.closest(\'.panel-left\').querySelector(\'input\').value)"><div class="fl">'+escHtml(c.fl)+'</div><div class="name">'+escHtml(c.name)+'</div>'+(cnt?'<div style="margin-top:3px"><span class="badge badge-blue">'+cnt+'件</span></div>':'')+
      '</div>';
  }).join('');
}
function showSupportLogs(fl){
  var c=MASTER_CASES.find(function(x){return x.fl===fl;});if(!c)return;
  var s=getStore();
  var logs=s.supportLogs.filter(function(l){return l.caseFL===fl;}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var catColors={'管理画面':'badge-blue','写真':'badge-purple','クチコミ':'badge-yellow','解約':'badge-red','請求':'badge-green','LINE':'badge-blue','その他':'badge-gray'};
  var rows=logs.map(function(l){return '<tr><td>'+escHtml(l.date)+'</td><td><span class="badge '+(catColors[l.category]||'badge-gray')+'">'+escHtml(l.category)+'</span></td><td>'+escHtml(l.summary)+'</td><td><button class="btn btn-sm btn-danger" onclick="deleteSupportLog(\''+escHtml(l.id)+'\',\''+escHtml(fl)+'\')">削除</button></td></tr>';}).join('');
  document.getElementById('support-right').innerHTML=
    '<div style="padding:12px 16px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between"><strong>'+escHtml(c.fl)+' - '+escHtml(c.name)+'</strong><button class="btn btn-primary btn-sm" onclick="openSupportForm(\''+escHtml(fl)+'\')">＋ 記録追加</button></div>' +
    '<div class="panel-right-inner">'+(logs.length?'<div class="table-wrap"><table><thead><tr><th>日付</th><th>分類</th><th>内容</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty-state"><div class="icon">🛟</div><p>記録なし</p></div>')+'</div>';
}
function openSupportForm(fl){
  openModal('サポート記録追加',
    '<div class="form-row"><div class="form-group"><label>日付</label><input type="date" id="sf-date" value="'+today()+'"></div><div class="form-group"><label>カテゴリ</label><select id="sf-cat"><option>管理画面</option><option>写真</option><option>クチコミ</option><option>解約</option><option>請求</option><option>LINE</option><option>その他</option></select></div></div>' +
    '<div class="form-group"><label>内容</label><textarea id="sf-summary"></textarea></div>',
    '<button class="btn btn-secondary" onclick="closeModal()">キャンセル</button><button class="btn btn-primary" onclick="saveSupportLog(\''+escHtml(fl)+'\')">保存</button>');
}
function saveSupportLog(fl){var s=getStore();s.supportLogs.push({id:uid(),caseFL:fl,date:document.getElementById('sf-date').value,category:document.getElementById('sf-cat').value,summary:document.getElementById('sf-summary').value});saveStore(s);closeModal();toast('保存しました');showSupportLogs(fl);}
function deleteSupportLog(id,fl){if(!confirm('削除しますか？'))return;var s=getStore();s.supportLogs=s.supportLogs.filter(function(l){return l.id!==id;});saveStore(s);toast('削除しました','info');showSupportLogs(fl);}

// PAYMENT
modules.payment = function() { renderPaymentModule(); };
function renderPaymentModule(){
  var ps=state.payment;var ym=ps.yearMonth.replace('-','');
  var bills=[];
  MASTER_CASES.forEach(function(c){
    (c.bills||[]).forEach(function(b){
      var bym=b.inv?b.inv.slice(0,6):'';
      if(bym===ym) bills.push(Object.assign({},b,{fl:c.fl,cname:c.name}));
    });
  });
  if(ps.paidFilter!=='全て'){
    if(ps.paidFilter==='完了') bills=bills.filter(function(b){return b.paid==='完了';});
    else if(ps.paidFilter==='未払い') bills=bills.filter(function(b){return b.paid!=='完了'&&b.paid!=='-'&&b.paid;});
    else bills=bills.filter(function(b){return !b.paid||b.paid==='-';});
  }
  var totalBills=bills.length;
  var paidCount=bills.filter(function(b){return b.paid==='完了';}).length;
  var totalAmt=bills.reduce(function(a,b){return a+(b.tax||0);},0);
  var paidAmt=bills.filter(function(b){return b.paid==='完了';}).reduce(function(a,b){return a+(b.tax||0);},0);
  var rows=bills.map(function(b){return '<tr><td><span style="font-weight:600;color:#3b82f6">'+escHtml(b.fl)+'</span></td><td>'+escHtml(b.cname)+'</td><td style="font-size:11px">'+escHtml(b.inv)+'</td><td>'+fmtMoney(b.tax)+'</td><td>'+escHtml(b.start)+'～'+escHtml(b.end)+'</td><td>'+paidBadge(b.paid)+'</td><td>'+escHtml(b.paid_date||'-')+'</td><td>'+escHtml(b.due||'-')+'</td></tr>';}).join('');
  document.getElementById('content').innerHTML=
    '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)"><div class="kpi-card"><div class="kpi-label">当月請求件数</div><div class="kpi-value">'+totalBills+'</div></div><div class="kpi-card green"><div class="kpi-label">入金済み</div><div class="kpi-value">'+paidCount+' <span style="font-size:14px;font-weight:400">('+fmtMoney(paidAmt)+')</span></div></div><div class="kpi-card red"><div class="kpi-label">未入金</div><div class="kpi-value">'+(totalBills-paidCount)+' <span style="font-size:14px;font-weight:400">('+fmtMoney(totalAmt-paidAmt)+')</span></div></div></div>' +
    '<div class="card"><div class="filter-bar"><input type="month" value="'+ps.yearMonth+'" onchange="state.payment.yearMonth=this.value;renderPaymentModule()" style="width:auto">' +
    '<select onchange="state.payment.paidFilter=this.value;renderPaymentModule()">'+['全て','完了','未払い','-'].map(function(v){return '<option value="'+v+'"'+(ps.paidFilter===v?' selected':'')+'>'+v+'</option>';}).join('')+'</select>' +
    '<span class="text-muted text-sm">'+bills.length+'件</span></div>' +
    (bills.length?'<div class="table-wrap"><table><thead><tr><th>FL番号</th><th>会社名</th><th>請求書番号</th><th>金額(税込)</th><th>対象期間</th><th>消込</th><th>入金日</th><th>期日</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty-state"><div class="icon">💴</div><p>該当なし</p></div>') +
    '</div>';
}

// LEARNING
modules.learning = function() { renderLearningModule(); };
function renderLearningModule(){
  var s=getStore();var ls=state.learning;
  var cats=['全て','MEO基礎','Googleビジネス','クチコミ対策','SEO','営業','ツール操作','その他'];
  if(ls.viewId){
    var item=s.learningItems.find(function(x){return x.id===ls.viewId;});
    if(item){
      document.getElementById('content').innerHTML=
        '<div class="card"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><button class="btn btn-secondary btn-sm" onclick="state.learning.viewId=null;modules.learning()">← 一覧に戻る</button><h2 style="font-size:16px;font-weight:700">'+escHtml(item.title)+'</h2><span class="badge badge-blue">'+escHtml(item.category)+'</span>'+(item.read?'<span class="badge badge-green">既読</span>':'')+'</div>' +
        '<div style="white-space:pre-wrap;font-size:14px;line-height:1.8;color:#374151">'+escHtml(item.content)+'</div>' +
        '<div style="margin-top:16px">'+(item.tags?item.tags.split(',').map(function(t){return '<span class="tag">'+escHtml(t.trim())+'</span>';}).join(''):'')+'</div>' +
        '<div style="margin-top:16px;display:flex;gap:8px"><button class="btn btn-success btn-sm" onclick="markLearningRead(\''+escHtml(item.id)+'\')">✓ 既読にする</button><button class="btn btn-danger btn-sm" onclick="deleteLearning(\''+escHtml(item.id)+'\')">削除</button></div>' +
        '</div>';
      return;
    }
  }
  var items=s.learningItems.slice();
  if(ls.catFilter!=='全て') items=items.filter(function(x){return x.category===ls.catFilter;});
  items.sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');});
  var catBtns=cats.map(function(c){return '<button class="btn '+(ls.catFilter===c?'btn-primary':'btn-secondary')+' btn-sm" onclick="state.learning.catFilter=\''+c+'\';modules.learning()">'+c+'</button>';}).join('');
  var cards=items.map(function(item){
    return '<div class="card" style="margin-bottom:10px;padding:14px"><div style="display:flex;align-items:start;justify-content:space-between">' +
      '<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span class="badge badge-blue">'+escHtml(item.category)+'</span>'+(item.read?'<span class="badge badge-green">既読</span>':'<span class="badge badge-gray">未読</span>')+'</div>' +
      '<div style="font-weight:600;font-size:14px;cursor:pointer;color:#1e40af" onclick="state.learning.viewId=\''+escHtml(item.id)+'\';modules.learning()">'+escHtml(item.title)+'</div>' +
      '<div style="font-size:12px;color:#9ca3af;margin-top:4px">'+escHtml(item.createdAt)+'</div>' +
      '<div style="margin-top:6px">'+((item.tags||'').split(',').filter(Boolean).map(function(t){return '<span class="tag">'+escHtml(t.trim())+'</span>';}).join(''))+'</div>' +
      '</div><div style="display:flex;gap:6px;flex-shrink:0;margin-left:12px">' +
      '<button class="btn btn-sm btn-secondary" onclick="state.learning.viewId=\''+escHtml(item.id)+'\';modules.learning()">読む</button>' +
      '<button class="btn btn-sm btn-danger" onclick="deleteLearning(\''+escHtml(item.id)+'\')">削除</button>' +
      '</div></div></div>';
  }).join('');
  document.getElementById('content').innerHTML=
    '<div class="section-header"><div class="section-title">MEO学習ライブラリ</div><button class="btn btn-primary btn-sm" onclick="openLearningForm()">＋ 記事追加</button></div>' +
    '<div class="filter-bar">'+catBtns+'</div>' +
    (items.length?cards:'<div class="empty-state"><div class="icon">📚</div><p>記事なし</p></div>');
}
function openLearningForm(){
  openModal('記事追加',
    '<div class="form-group"><label>タイトル</label><input type="text" id="lf2-title"></div>' +
    '<div class="form-row"><div class="form-group"><label>カテゴリ</label><select id="lf2-cat"><option>MEO基礎</option><option>Googleビジネス</option><option>クチコミ対策</option><option>SEO</option><option>営業</option><option>ツール操作</option><option>その他</option></select></div><div class="form-group"><label>タグ(カンマ区切り)</label><input type="text" id="lf2-tags" placeholder="MEO,Google,..."></div></div>' +
    '<div class="form-group"><label>内容</label><textarea id="lf2-content" rows="8"></textarea></div>',
    '<button class="btn btn-secondary" onclick="closeModal()">キャンセル</button><button class="btn btn-primary" onclick="saveLearning()">保存</button>','modal-lg');
}
function saveLearning(){var s=getStore();s.learningItems.push({id:uid(),title:document.getElementById('lf2-title').value,category:document.getElementById('lf2-cat').value,tags:document.getElementById('lf2-tags').value,content:document.getElementById('lf2-content').value,createdAt:today(),read:false});saveStore(s);closeModal();toast('保存しました');modules.learning();}
function markLearningRead(id){var s=getStore();var item=s.learningItems.find(function(x){return x.id===id;});if(item)item.read=true;saveStore(s);toast('既読にしました');modules.learning();}
function deleteLearning(id){if(!confirm('削除しますか？'))return;var s=getStore();s.learningItems=s.learningItems.filter(function(x){return x.id!==id;});saveStore(s);state.learning.viewId=null;toast('削除しました','info');modules.learning();}


initApp();
</script>
